name: Build and release
on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Verify release version
        id: version
        shell: bash
        run: |
          version=$(dotnet msbuild MatysiakAmmoBalance.csproj -nologo -getProperty:Version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
      - name: Build against real game and EXILED assemblies
        run: dotnet build MatysiakAmmoBalance.csproj -c Release -p:Platform=x64
      - name: Run regression scenarios
        run: dotnet run --project tests/AmmoBalance.Tests.csproj -c Release
      - name: Prepare checksum
        shell: bash
        run: |
          cd bin/x64/Release/net48
          sha256sum AmmoBalance.dll > AmmoBalance.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AmmoBalance-${{ steps.version.outputs.version }}
          path: |
            bin/x64/Release/net48/AmmoBalance.dll
            bin/x64/Release/net48/AmmoBalance.sha256
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, '[release]')))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      AMMO_ARTIFACT_NAME: AmmoBalance-${{ needs.build.outputs.version }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify or create the release tag at the tested commit
        shell: bash
        run: |
          tag="v$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi
      - name: Download the tested binary and publish the tagged release
        shell: bash
        run: |
          gh run download "$GITHUB_RUN_ID" --name "$AMMO_ARTIFACT_NAME" --dir release
          cd release
          sha256sum --check AmmoBalance.sha256
          gh release create "v$RELEASE_VERSION" --verify-tag --title "AmmoBalance v$RELEASE_VERSION" --notes-file "$GITHUB_WORKSPACE/RELEASE_NOTES.md" AmmoBalance.dll AmmoBalance.sha256
